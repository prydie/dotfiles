# Keep Bluetooth audio devices on A2DP. Never auto-switch to HSP/HFP.
#
# By default WirePlumber moves a Bluetooth device from A2DP to the headset
# profile as soon as an application opens its microphone, and moves it back
# when the microphone closes. The headset profile carries audio over a SCO
# link, and each switch renegotiates that link while audio is streaming.
#
# An application that never releases the microphone pins the device in the
# headset profile. Chrome does this: it can leave capture streams running
# after a call ends. WirePlumber then writes the headset profile into
# ~/.local/state/wireplumber/default-profile and, worse, into
# bluetooth-autoswitch as the profile to restore *after* a call. The device
# then starts every subsequent connection in the headset profile and never
# returns to A2DP, so all playback runs over SCO and stutters.
#
# With the auto-switch off, Bluetooth devices stay on A2DP and the SCO path is
# never used. The trade-off is that Bluetooth microphones are unavailable;
# select a built-in or USB microphone for calls.
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}
