command_timeout = 1000
scan_timeout = 10

[python]
python_binary = "python3"
detect_files = []
detect_extensions = []
detect_folders = []

[kubernetes]
format = '[$symbol$context( \($namespace\))]($style) in '
disabled = false
[kubernetes.context_aliases]

[java]
disabled = true

[package]
disabled = true

[custom.mapi]
symbol = "🗺️"
command = """
endpoint="${MAPI_ENDPOINT:-}"
sub="${endpoint%%.*}"
env="${sub#*-}"
[ "${env}" = "${sub}" ] && env="${sub}"
[ "${env}" = "mapi" ] && env="prod"
domain="${endpoint#*.}"
[ "${domain}" = "${endpoint}" ] && domain=""
printf "%s %s" "${env}" "${domain}"
"""
when = """ [ -n "$MAPI_ENDPOINT" ] """
format = " [\\($symbol  $output\\) ]($style)"

# Which nscale environment this shell is pointed at, after `nsc use <profile>`.
# The failure mode this guards against is invisible by nature -- the CLI takes
# its endpoints, its IDs and its credentials from three unrelated places -- so
# seeing the answer in the prompt is most of the fix.
[custom.nscale]
symbol = "☁"
command = 'printf "%s" "${NSC_PROFILE}"'
when = ''' [ -n "$NSC_PROFILE" ] '''
format = " [\\($symbol  $output\\) ]($style)"
style = "bold red"
