# ci-remote host registry -> ~/.config/ci-remote/hosts.conf
#
# This file is TRACKED IN A PUBLIC REPO. It carries the shape of the config and
# nothing else. Real hosts -- names, mount points, cache paths, capacities --
# belong in the untracked ~/.config/ci-remote/hosts.local.conf beside it, which
# is read afterwards and wins on conflicts.
#
# One section per remote box. ci-remote never reads anything from the repository
# under test, so all host-specific policy lives here.
#
# Keys:
#   ssh          ssh destination (an alias from ~/.ssh/config); defaults to the
#                section name
#   prelude      shell run before each job. Non-interactive ssh sources no login
#                profile, so anything PATH-shaped goes here. It may reference
#                $RUN_DIR and $JOB_DIR, which the driver defines first.
#   root         where workspaces, runs and logs live on the box. Must be
#                writable by the ssh user, and wants a filesystem with room --
#                a synced checkout plus its build output is not small.
#   parallel     how many jobs may run concurrently
#   nice         prefix applied to every step (scheduling policy, wrappers).
#                Being a good citizen on a shared box belongs here.
#   env          extra VAR=VALUE pairs exported into every job, space separated.
#                Pointing GOCACHE/GOMODCACHE (or an equivalent) at a persistent
#                per-host cache is what makes repeat runs fast.
#   min_free_gb  refuse to start below this much free space under `root`
#
# [defaults]
# host = example
#
# [example]
# ssh = example.internal
# prelude = export PATH=/usr/local/go/bin:$PATH
# root = /srv/ci-remote
# parallel = 4
# nice = nice -n 19 ionice -c 3
# env = GOCACHE=/srv/ci-cache/go-build GOMODCACHE=/srv/ci-cache/go-mod
# min_free_gb = 25
