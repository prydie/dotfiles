# Single source of truth for mise-managed CLI tools. Add or pin a tool here and
# it installs on the next `make setup` / `mise install` — there is no parallel
# list in hooks/os to keep in sync.
#
# Personal, machine-local tools (e.g. tools you only want on a personal laptop)
# go in an untracked ~/.config/mise/config.local.toml, which mise loads
# automatically and which is gitignored so it never lands on other machines.
[tools]
node = "24.18.0"  # LTS; also satisfies the npm: backend below, which needs npm on PATH even in non-interactive shells where zsh-nvm never loads. Held on the 24.x LTS line — 26.x is current, not LTS until Oct 2026.
neovim = "0.12.4"
starship = "1.26.0"
atuin = "18.18.1"
doctl = "1.164.0"
gh = "2.96.0"
"github:agavra/tuicr" = "v0.19.1"
kubectl = "1.36.3"
kubectx = "0.11.0"
kubens = "0.11.0"
vale = "3.15.2"
helm = "4.2.3"
kubebuilder = "4.15.0"
kind = "0.32.0"
tilt = "0.37.5"
mkcert = "1.4.4"
ginkgo = "latest"
sonobuoy = "latest"
cilium-cli = "latest"
promtool = "3.13.1"
loki-logcli = "3.7.4"
teleport-community = "18.10.0"
"pipx:autopep8" = "2.3.2"
"pipx:awscli" = "1.45.57"
"pipx:black" = "latest"
"pipx:esptool" = "latest"
"pipx:isort" = "latest"
"pipx:mypy" = "latest"
"pipx:python-openstackclient" = { version = "10.2.1", uvx_args = "--with python-octaviaclient==3.13.0" }
nerdctl = "2.3.5"
"pipx:oci-cli" = "3.89.3"
regctl = "0.11.5"
cosign = "3.1.2"
"pipx:ruff" = "latest"
"github:pamburus/hl" = "0.36.3"  # pretty-print/filter JSON logs: kubectl logs -f ... | hl
"github:tsenart/vegeta" = "v12.13.0"
"npm:@usebruno/cli" = "4.0.0"
"npm:playwright" = "latest"  # headless browser automation; driven against system google-chrome (channel: 'chrome')
"npm:@mermaid-js/mermaid-cli" = "latest"  # render Mermaid diagrams to PNG/SVG (mmdc); bundles its own Chromium via puppeteer at install
